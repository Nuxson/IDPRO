<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор уникальных ID</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --ok:#4ade80; --err:#f87171; --txt:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.5rem; } h2 { font-size:1.1rem; color:var(--accent); margin-top:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  label { display:block; font-size:.85rem; margin:10px 0 4px; color:#94a3b8; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--txt); font-size:1rem; }
  input:focus { outline:none; border-color:var(--accent); }
  button { margin-top:14px; width:100%; padding:11px; border:none; border-radius:8px; background:var(--accent); color:#082f49; font-weight:700; font-size:1rem; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .result { margin-top:14px; padding:12px; border-radius:8px; background:#0f172a; font-family:Consolas,monospace; word-break:break-all; display:none; }
  .id-big { font-size:1.4rem; letter-spacing:2px; color:var(--ok); text-align:center; }
  .err { color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:10px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #334155; }
  th { color:#94a3b8; }
  .badge { padding:2px 8px; border-radius:99px; font-size:.75rem; }
  .b-ok { background:rgba(74,222,128,.15); color:var(--ok); }
  .b-err { background:rgba(248,113,113,.15); color:var(--err); }
  .hint { font-size:.78rem; color:#64748b; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Генератор уникальных ID</h1>
  <div class="grid">

    <div class="card">
      <h2>Создать ID</h2>
      <form id="genForm">
        <label>Производитель</label>
        <input name="producer" placeholder="напр. Роботех" required>
        <label>Дата</label>
        <input name="date" type="date" required>
        <label>Место положения</label>
        <input name="location" placeholder="напр. Москва" required>
        <label>Компания</label>
        <input name="company" placeholder="напр. Технопарк" required>
        <label>Серийный номер</label>
        <input name="serial" placeholder="напр. SN-00123" required>
        <button type="submit">Сгенерировать и сохранить</button>
      </form>
      <div class="result" id="genResult"></div>
      <div class="hint">ID детерминирован: одинаковые данные → одинаковый код. Повторное сохранение вернёт существующий ID.</div>
    </div>

    <div class="card">
      <h2>Проверить ID</h2>
      <form id="verForm">
        <label>Код для проверки</label>
        <input name="id" placeholder="XXXX-XXXX-XXXX-XX" required style="letter-spacing:1px">
        <button type="submit">Проверить</button>
      </form>
      <div class="result" id="verResult"></div>
      <div class="hint">Проверка контрольного кода работает даже без доступа к базе (как CRC у серийных номеров).</div>

      <h2 style="margin-top:24px">Последние записи</h2>
      <div id="list"><em style="color:#64748b">—</em></div>
    </div>

  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || 'Ошибка запроса');
  return j;
}

$('#genForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const box = $('#genResult'); box.style.display='block'; box.textContent='…';
  try {
    const res = await api('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.fromEntries(f))
    });
    const rec = res.record;
    box.innerHTML = `<div class="id-big">${esc(rec.id)}</div>
      <div style="text-align:center;margin-top:6px">
        <span class="badge ${res.created?'b-ok':'b-err'}">${res.created?'создан новый':'уже существовал в базе'}</span>
      </div>`;
    loadList();
  } catch(err){ box.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
});

$('#verForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = new FormData(e.target).get('id');
  const box = $('#verResult'); box.style.display='block'; box.textContent='…';
  try {
    const res = await api('/api/verify?id=' + encodeURIComponent(id));
    let html = '';
    html += `Контрольный код: <span class="badge ${res.checksum_valid?'b-ok':'b-err'}">${res.checksum_valid?'✔ верен':'✘ не верен'}</span><br>`;
    html += `Присутствует в базе: <span class="badge ${res.found_in_db?'b-ok':'b-err'}">${res.found_in_db?'✔ да':'✘ нет'}</span><br>`;
    if (res.authentic && res.record) {
      html += `<span class="badge b-ok" style="margin:6px 0;display:inline-block">ПОДЛИННЫЙ ID</span><br>`;
      const r = res.record;
      html += `<table>
        <tr><th>Производитель</th><td>${esc(r.producer)}</td></tr>
        <tr><th>Дата</th><td>${esc(r.date)}</td></tr>
        <tr><th>Место</th><td>${esc(r.location)}</td></tr>
        <tr><th>Компания</th><td>${esc(r.company)}</td></tr>
        <tr><th>Серийный №</th><td>${esc(r.serial)}</td></tr>
        <tr><th>Выдан</th><td>${esc(r.created_at)} UTC</td></tr></table>`;
    } else if (res.checksum_valid && !res.found_in_db) {
      html += `<span class="err">Формат корректен, но в базе такой код отсутствует.</span>`;
    } else if (!res.checksum_valid) {
      html += `<span class="err">Код не проходит проверку — вероятно опечатка или подделка.</span>`;
    }
    box.innerHTML = html;
  } catch(err){ box.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
});

async function loadList() {
  try {
    const rows = await api('/api/list?limit=15');
    $('#list').innerHTML = rows.length
      ? `<table><tr><th>ID</th><th>Серийный №</th><th>Компания</th></tr>` +
        rows.map(r=>`<tr><td style="font-family:Consolas,monospace">${esc(r.id)}</td><td>${esc(r.serial)}</td><td>${esc(r.company)}</td></tr>`).join('') +
        `</table>`
      : '<em style="color:#64748b">база пуста</em>';
  } catch(e){ /* ignore */ }
}
loadList();
</script>
</body>
</html>
